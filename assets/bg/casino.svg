<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 250" preserveAspectRatio="xMidYMid slice">
  <!-- カジノステージ: 夜の カジノの 中 (シャンデリア・カーテン・スロット台・カードテーブル) -->
  <defs>
    <radialGradient id="room" cx="50%" cy="35%" r="75%"><stop offset="0" stop-color="#2a8a62"/><stop offset=".6" stop-color="#0f4a33"/><stop offset="1" stop-color="#05200f"/></radialGradient>
    <linearGradient id="curt" x1="0" x2="1"><stop offset="0" stop-color="#5a0a14"/><stop offset=".5" stop-color="#a8182a"/><stop offset="1" stop-color="#5a0a14"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6c0" stop-opacity=".9"/><stop offset="1" stop-color="#ffd54a" stop-opacity="0"/></radialGradient>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f7a4d"/><stop offset="1" stop-color="#0c3d24"/></linearGradient>
    <pattern id="diamond" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M12 2 L22 12 L12 22 L2 12 Z" fill="none" stroke="#3fa877" stroke-opacity=".18" stroke-width="1.2"/></pattern>
  </defs>
  <rect width="450" height="250" fill="url(#room)"/>
  <rect width="450" height="170" fill="url(#diamond)"/>
  <!-- カーテン -->
  <path d="M0 0 H70 Q60 80 40 170 H0 Z" fill="url(#curt)"/>
  <path d="M450 0 H380 Q390 80 410 170 H450 Z" fill="url(#curt)"/>
  <path d="M0 0 H450 V14 Q420 30 390 14 Q360 30 330 14 Q300 30 270 14 Q240 30 210 14 Q180 30 150 14 Q120 30 90 14 Q60 30 30 14 Q15 22 0 14 Z" fill="#8a1220"/>
  <path d="M0 14 Q15 22 30 14 Q60 30 90 14 Q120 30 150 14 Q180 30 210 14 Q240 30 270 14 Q300 30 330 14 Q360 30 390 14 Q420 30 450 14" fill="none" stroke="#ffd54a" stroke-width="2"/>
  <!-- シャンデリア -->
  <circle cx="225" cy="52" r="70" fill="url(#glow)"/>
  <line x1="225" y1="14" x2="225" y2="36" stroke="#c9a040" stroke-width="2"/>
  <path d="M185 46 Q225 70 265 46" fill="none" stroke="#e8c060" stroke-width="3"/>
  <path d="M198 40 Q225 58 252 40" fill="none" stroke="#e8c060" stroke-width="2"/>
  <g fill="#fffbe0">
    <circle cx="185" cy="46" r="3"/><circle cx="205" cy="54" r="3"/><circle cx="225" cy="58" r="3.5"/><circle cx="245" cy="54" r="3"/><circle cx="265" cy="46" r="3"/>
    <circle cx="198" cy="40" r="2.5"/><circle cx="225" cy="45" r="3"/><circle cx="252" cy="40" r="2.5"/>
  </g>
  <g fill="#bff0ff" opacity=".8"><path d="M205 58 l3 8 l-3 4 l-3 -4 z"/><path d="M225 62 l3 10 l-3 4 l-3 -4 z"/><path d="M245 58 l3 8 l-3 4 l-3 -4 z"/></g>
  <!-- 奥の スロット台 -->
  <g>
    <rect x="80" y="96" width="44" height="74" rx="5" fill="#2a2f45" stroke="#ffd54a" stroke-width="1.5"/><rect x="86" y="104" width="32" height="22" rx="2" fill="#7fd8ff" opacity=".7"/><text x="102" y="122" font-family="Arial Black,sans-serif" font-size="12" fill="#e3171e" text-anchor="middle">777</text><circle cx="102" cy="90" r="5" fill="#ff4f4f"/>
    <rect x="132" y="100" width="40" height="70" rx="5" fill="#2a2f45" stroke="#ffd54a" stroke-width="1.5"/><rect x="138" y="108" width="28" height="20" rx="2" fill="#ffe28a" opacity=".7"/><text x="152" y="124" font-family="Arial Black,sans-serif" font-size="11" fill="#1d5fd6" text-anchor="middle">BAR</text><circle cx="152" cy="94" r="5" fill="#4fd0ff"/>
    <rect x="278" y="100" width="40" height="70" rx="5" fill="#2a2f45" stroke="#ffd54a" stroke-width="1.5"/><rect x="284" y="108" width="28" height="20" rx="2" fill="#ffb0d0" opacity=".7"/><text x="298" y="124" font-family="Arial Black,sans-serif" font-size="11" fill="#e3171e" text-anchor="middle">7 7</text><circle cx="298" cy="94" r="5" fill="#ffd54a"/>
    <rect x="326" y="96" width="44" height="74" rx="5" fill="#2a2f45" stroke="#ffd54a" stroke-width="1.5"/><rect x="332" y="104" width="32" height="22" rx="2" fill="#7fd8ff" opacity=".7"/><text x="348" y="122" font-family="Arial Black,sans-serif" font-size="12" fill="#1d5fd6" text-anchor="middle">BJ</text><circle cx="348" cy="90" r="5" fill="#ff4f4f"/>
  </g>
  <!-- 床と カードテーブル -->
  <rect y="170" width="450" height="80" fill="#3a0f18"/>
  <path d="M0 170 H450" stroke="#ffd54a" stroke-width="2"/>
  <g opacity=".35" fill="#ffd54a"><circle cx="40" cy="210" r="3"/><circle cx="110" cy="230" r="3"/><circle cx="340" cy="232" r="3"/><circle cx="410" cy="208" r="3"/></g>
  <ellipse cx="225" cy="222" rx="150" ry="40" fill="#5a3010"/>
  <ellipse cx="225" cy="218" rx="140" ry="34" fill="url(#felt)"/>
  <ellipse cx="225" cy="218" rx="118" ry="24" fill="none" stroke="#ffd54a" stroke-opacity=".6" stroke-width="1.5"/>
  <g transform="translate(150 206) rotate(-12)"><rect width="18" height="24" rx="2" fill="#fff"/><text x="9" y="12" font-size="9" font-weight="bold" text-anchor="middle" fill="#111">A</text><text x="9" y="21" font-size="8" text-anchor="middle" fill="#111">♠</text></g>
  <g transform="translate(170 204) rotate(6)"><rect width="18" height="24" rx="2" fill="#fff"/><text x="9" y="12" font-size="9" font-weight="bold" text-anchor="middle" fill="#d11">K</text><text x="9" y="21" font-size="8" text-anchor="middle" fill="#d11">♥</text></g>
  <g stroke="#fff" stroke-width="1" stroke-dasharray="2 2"><circle cx="280" cy="214" r="7" fill="#e3171e"/><circle cx="296" cy="220" r="7" fill="#1d5fd6"/><circle cx="288" cy="206" r="7" fill="#ffd54a"/></g>
</svg>
