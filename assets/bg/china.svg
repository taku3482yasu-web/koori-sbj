<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 250" preserveAspectRatio="xMidYMid slice">
  <!-- チャイナステージ: 赤い 夜空に ちょうちん・楼閣の 屋根・雲の もよう -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="80%"><stop offset="0" stop-color="#c8242a"/><stop offset=".6" stop-color="#7a0a12"/><stop offset="1" stop-color="#2b0505"/></radialGradient>
    <radialGradient id="lan" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#ffd27a"/><stop offset=".5" stop-color="#ff5a2a"/><stop offset="1" stop-color="#b0101a"/></radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb04a" stop-opacity=".5"/><stop offset="1" stop-color="#ffb04a" stop-opacity="0"/></radialGradient>
    <symbol id="lantern" viewBox="-20 -30 40 64">
      <circle r="28" fill="url(#halo)"/>
      <line x1="0" y1="-30" x2="0" y2="-18" stroke="#3a1a08" stroke-width="1.5"/>
      <rect x="-8" y="-19" width="16" height="4" fill="#ffd54a"/>
      <ellipse rx="16" ry="15" fill="url(#lan)"/>
      <g stroke="#8a0a10" stroke-width="1" fill="none" opacity=".6"><ellipse rx="10" ry="15"/><ellipse rx="4" ry="15"/></g>
      <rect x="-8" y="14" width="16" height="4" fill="#ffd54a"/>
      <g stroke="#ffd54a" stroke-width="1"><line x1="-4" y1="18" x2="-4" y2="30"/><line x1="0" y1="18" x2="0" y2="33"/><line x1="4" y1="18" x2="4" y2="30"/></g>
      <text y="5" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffe08a" font-family="serif">福</text>
    </symbol>
    <pattern id="cloud" width="60" height="30" patternUnits="userSpaceOnUse"><path d="M5 20 q5 -10 15 -5 q5 -10 15 0 q10 -5 12 5" fill="none" stroke="#ffd54a" stroke-opacity=".15" stroke-width="1.5"/></pattern>
  </defs>
  <rect width="450" height="250" fill="url(#sky)"/>
  <rect width="450" height="250" fill="url(#cloud)"/>
  <!-- 月 -->
  <circle cx="168" cy="62" r="30" fill="#ffe9b0" opacity=".85"/>
  <circle cx="168" cy="62" r="42" fill="#ffe9b0" opacity=".15"/>
  <!-- 楼閣 -->
  <g fill="#2a0508">
    <rect x="150" y="150" width="150" height="70"/>
    <path d="M120 152 Q225 128 330 152 L320 160 Q225 140 130 160 Z"/>
    <rect x="175" y="110" width="100" height="42"/>
    <path d="M150 112 Q225 88 300 112 L290 120 Q225 100 160 120 Z"/>
    <rect x="200" y="78" width="50" height="34"/>
    <path d="M182 80 Q225 58 268 80 L260 86 Q225 70 190 86 Z"/>
    <rect x="223" y="48" width="4" height="22"/>
  </g>
  <g fill="#ffcf5a" opacity=".85">
    <rect x="165" y="170" width="14" height="20"/><rect x="190" y="170" width="14" height="20"/><rect x="246" y="170" width="14" height="20"/><rect x="271" y="170" width="14" height="20"/>
    <rect x="188" y="124" width="12" height="16"/><rect x="219" y="124" width="12" height="16"/><rect x="250" y="124" width="12" height="16"/>
    <rect x="216" y="88" width="18" height="14"/>
  </g>
  <rect x="210" y="186" width="30" height="34" fill="#ffcf5a" opacity=".6"/>
  <!-- ちょうちん (ひもで つながる) -->
  <path d="M0 22 Q110 60 225 26 Q340 60 450 22" fill="none" stroke="#3a1a08" stroke-width="1.5"/>
  <use href="#lantern" x="30" y="30" width="40" height="64"/>
  <use href="#lantern" x="100" y="40" width="40" height="64"/>
  <use href="#lantern" x="310" y="40" width="40" height="64"/>
  <use href="#lantern" x="380" y="30" width="40" height="64"/>
  <!-- 地面 -->
  <rect y="218" width="450" height="32" fill="#1a0306"/>
  <path d="M0 218 H450" stroke="#ffd54a" stroke-width="1.5" stroke-opacity=".6"/>
  <g fill="none" stroke="#ffd54a" stroke-opacity=".35" stroke-width="1.5"><path d="M20 236 h20 v-8 h-12 v4"/><path d="M90 236 h20 v-8 h-12 v4"/><path d="M340 236 h20 v-8 h-12 v4"/><path d="M410 236 h20 v-8 h-12 v4"/></g>
</svg>
