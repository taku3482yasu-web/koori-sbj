    <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fffbd0"/><stop offset=".6" stop-color="#ffd24a"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient>
