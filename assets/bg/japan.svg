<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 250" preserveAspectRatio="xMidYMid slice">
  <!-- ジャパンステージ: 紫の 夜・満月・五重塔・鳥居・桜・池 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0b3e"/><stop offset=".6" stop-color="#5b3a9e"/><stop offset="1" stop-color="#9a6ac8"/></linearGradient>
    <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a7a"/><stop offset="1" stop-color="#140a30"/></linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fffbe8"/><stop offset=".7" stop-color="#ffe9b0"/><stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/></radialGradient>
    <symbol id="petal" viewBox="0 0 10 10"><path d="M5 0 Q10 4 5 10 Q0 4 5 0 Z" fill="#ffc0dc"/></symbol>
  </defs>
  <rect width="450" height="250" fill="url(#sky)"/>
  <g fill="#fff" opacity=".7"><circle cx="40" cy="30" r="1"/><circle cx="90" cy="60" r="1.2"/><circle cx="150" cy="20" r="1"/><circle cx="260" cy="40" r="1"/><circle cx="420" cy="26" r="1.3"/><circle cx="380" cy="80" r="1"/><circle cx="200" cy="70" r=".8"/></g>
  <circle cx="330" cy="68" r="56" fill="url(#moon)" opacity=".5"/>
  <circle cx="330" cy="68" r="34" fill="#fffbe8"/>
  <!-- 遠くの 山 -->
  <path d="M0 170 L60 130 L110 155 L170 118 L240 160 L300 135 L360 158 L420 128 L450 145 V190 H0 Z" fill="#2a1a5a" opacity=".9"/>
  <!-- 五重塔 -->
  <g fill="#120828">
    <rect x="96" y="80" width="3" height="20"/>
    <path d="M78 104 H118 L110 98 H86 Z"/><rect x="88" y="104" width="20" height="10"/>
    <path d="M74 118 H122 L113 112 H83 Z"/><rect x="86" y="118" width="24" height="10"/>
    <path d="M70 132 H126 L116 126 H80 Z"/><rect x="84" y="132" width="28" height="10"/>
    <path d="M66 146 H130 L119 140 H77 Z"/><rect x="82" y="146" width="32" height="10"/>
    <path d="M62 160 H134 L122 154 H74 Z"/><rect x="80" y="160" width="36" height="22"/>
  </g>
  <g fill="#ffcf5a" opacity=".7"><rect x="95" y="106" width="6" height="5"/><rect x="95" y="120" width="6" height="5"/><rect x="95" y="134" width="6" height="5"/><rect x="95" y="148" width="6" height="5"/><rect x="93" y="166" width="10" height="10"/></g>
  <!-- 鳥居 -->
  <g fill="#d0283a">
    <path d="M250 120 Q300 112 350 120 L352 128 Q300 120 248 128 Z"/>
    <rect x="258" y="134" width="84" height="7"/>
    <rect x="266" y="126" width="9" height="66"/><rect x="325" y="126" width="9" height="66"/>
  </g>
  <rect x="246" y="117" width="108" height="4" fill="#1a0a1a"/>
  <!-- 池 -->
  <rect y="190" width="450" height="60" fill="url(#pond)"/>
  <g stroke="#fffbe8" stroke-opacity=".5" stroke-width="2"><line x1="300" y1="200" x2="360" y2="200"/><line x1="310" y1="210" x2="350" y2="210"/><line x1="318" y1="220" x2="342" y2="220"/></g>
  <g stroke="#d0283a" stroke-opacity=".35" stroke-width="5"><line x1="270" y1="196" x2="270" y2="230"/><line x1="330" y1="196" x2="330" y2="230"/></g>
  <!-- 桜の 枝 -->
  <path d="M0 30 Q50 40 90 20 Q120 10 150 18" fill="none" stroke="#3a1a2a" stroke-width="5"/>
  <path d="M60 33 Q70 50 64 66" fill="none" stroke="#3a1a2a" stroke-width="3"/>
  <g fill="#ffb0d4">
    <circle cx="20" cy="30" r="9"/><circle cx="42" cy="38" r="10"/><circle cx="70" cy="30" r="9"/><circle cx="92" cy="20" r="10"/><circle cx="120" cy="14" r="8"/><circle cx="146" cy="18" r="8"/><circle cx="64" cy="60" r="8"/><circle cx="30" cy="16" r="7"/>
  </g>
  <g fill="#ffe0ee"><circle cx="24" cy="27" r="3"/><circle cx="46" cy="35" r="3"/><circle cx="94" cy="17" r="3"/><circle cx="66" cy="57" r="3"/></g>
  <use href="#petal" x="170" y="60" width="7" height="7"/><use href="#petal" x="210" y="100" width="6" height="6"/><use href="#petal" x="140" y="120" width="7" height="7"/><use href="#petal" x="400" y="150" width="6" height="6"/><use href="#petal" x="230" y="40" width="5" height="5"/>
</svg>
