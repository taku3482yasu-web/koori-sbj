<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 250" preserveAspectRatio="xMidYMid slice">
  <!-- こおりチャンス: 氷の 宮殿の 大広間 (氷の 柱・スポットライト・トランプの マーク) -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0" stop-color="#3a8ae0"/><stop offset=".55" stop-color="#1050a0"/><stop offset="1" stop-color="#020c26"/></radialGradient>
    <linearGradient id="ice" x1="0" x2="1"><stop offset="0" stop-color="#bff0ff" stop-opacity=".25"/><stop offset=".5" stop-color="#e8fbff" stop-opacity=".75"/><stop offset="1" stop-color="#bff0ff" stop-opacity=".25"/></linearGradient>
    <linearGradient id="spot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8fbff" stop-opacity=".45"/><stop offset="1" stop-color="#e8fbff" stop-opacity="0"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ab0f0"/><stop offset="1" stop-color="#0a2a60"/></linearGradient>
  </defs>
  <rect width="450" height="250" fill="url(#bg)"/>
  <!-- スポットライト -->
  <path d="M150 0 L190 0 L260 200 L120 200 Z" fill="url(#spot)"/>
  <path d="M260 0 L300 0 L330 200 L190 200 Z" fill="url(#spot)"/>
  <!-- 氷の 柱 -->
  <g>
    <rect x="20" y="20" width="36" height="170" fill="url(#ice)"/><path d="M14 20 H62 L56 30 H20 Z" fill="#e8fbff" opacity=".8"/>
    <rect x="394" y="20" width="36" height="170" fill="url(#ice)"/><path d="M388 20 H436 L430 30 H394 Z" fill="#e8fbff" opacity=".8"/>
    <rect x="86" y="44" width="24" height="146" fill="url(#ice)" opacity=".7"/>
    <rect x="340" y="44" width="24" height="146" fill="url(#ice)" opacity=".7"/>
  </g>
  <!-- つらら -->
  <g fill="#e8fbff" opacity=".85">
    <path d="M0 0 H450 V8 L440 22 L430 8 L415 30 L400 8 L385 18 L370 8 L350 34 L330 8 L310 20 L290 8 L270 28 L250 8 L230 24 L210 8 L190 30 L170 8 L150 22 L130 8 L110 32 L90 8 L70 20 L50 8 L30 26 L15 8 L0 18 Z"/>
  </g>
  <!-- トランプの マーク (うすく) -->
  <g font-family="serif" font-size="40" text-anchor="middle" opacity=".18" fill="#fff">
    <text x="140" y="110">♠</text><text x="310" y="110">♥</text><text x="190" y="160">♦</text><text x="260" y="160">♣</text>
  </g>
  <!-- 雪の 結晶 -->
  <g stroke="#e8fbff" stroke-width="2" stroke-linecap="round" opacity=".6">
    <g transform="translate(225 62)"><line y1="-12" y2="12"/><line x1="-10" y1="-6" x2="10" y2="6"/><line x1="-10" y1="6" x2="10" y2="-6"/></g>
    <g transform="translate(70 210) scale(.6)"><line y1="-12" y2="12"/><line x1="-10" y1="-6" x2="10" y2="6"/><line x1="-10" y1="6" x2="10" y2="-6"/></g>
    <g transform="translate(380 214) scale(.6)"><line y1="-12" y2="12"/><line x1="-10" y1="-6" x2="10" y2="6"/><line x1="-10" y1="6" x2="10" y2="-6"/></g>
  </g>
  <!-- 氷の 床 -->
  <path d="M0 190 H450 V250 H0 Z" fill="url(#floor)" opacity=".85"/>
  <g stroke="#bff0ff" stroke-opacity=".35" stroke-width="1"><line x1="225" y1="190" x2="0" y2="250"/><line x1="225" y1="190" x2="120" y2="250"/><line x1="225" y1="190" x2="225" y2="250"/><line x1="225" y1="190" x2="330" y2="250"/><line x1="225" y1="190" x2="450" y2="250"/><line x1="0" y1="215" x2="450" y2="215"/></g>
</svg>
