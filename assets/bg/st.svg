  <g fill="#e8fbff"><path d="M70 120 L84 134 L76 132 L70 138 L64 132 L56 134 Z"/><path d="M190 100 L208 118 L198 116 L190 124 L182 116 L172 118 Z"/><path d="M450 110 L450 128 L440 122 L432 128 Z"/><path d="M320 130 L332 142 L326 140 L320 146 L314 140 L308 142 Z"/></g>
