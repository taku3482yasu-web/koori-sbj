    <linearGradient id="aur" x1="0" x2="1"><stop offset="0" stop-color="#5affc0" stop-opacity="0"/><stop offset=".3" stop-color="#5affc0" stop-opacity=".55"/><stop offset=".7" stop-color="#7ad8ff" stop-opacity=".5"/><stop offset="1" stop-color="#b07aff" stop-opacity="0"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c07a30"/><stop offset="1" stop-color="#6a3a10"/></linearGradient>
  </defs>
  <rect width="450" height="250" fill="url(#sky)"/>
